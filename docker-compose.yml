services:
  postgres:
    image: postgres:16-alpine
    container_name: fitsphere_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitsphere_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitsphere_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-fitsphere_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitsphere_user} -d ${POSTGRES_DB:-fitsphere_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fitsphere_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: fitsphere_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-fitsphere_user}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-fitsphere_local_password}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"       # AMQP protocol
      - "15672:15672"                       # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
    name: fitsphere_postgres_data
  redis_data:
    name: fitsphere_redis_data
  rabbitmq_data:
    name: fitsphere_rabbitmq_data
