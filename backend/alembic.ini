# A generic, single database configuration.

[alembic]
# path to migration scripts (using %(here)s so it works from root or backend directory)
script_location = %(here)s/alembic

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# version location specification (defaults to script_location/versions)
# version_locations = %(here)s/alembic/versions

# the output encoding used when revision files are written from script.py.mako
output_encoding = utf-8

# sqlalchemy.url will be dynamically loaded in alembic/env.py from app.core.config.settings
sqlalchemy.url = postgresql://fitsphere_user:fitsphere_local_password@localhost:5432/fitsphere_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
